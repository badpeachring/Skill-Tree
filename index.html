<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Skill Tree</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { background-color: #030712; color: #f3f4f6; font-family: system-ui, sans-serif; touch-action: manipulation; }
    .node-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); } 50% { opacity: 0.7; filter: drop-shadow(0 0 4px #0284c7); } }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col select-none">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="fixed inset-0 z-50 bg-gray-950 flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-sm bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl">
      <h1 class="text-2xl font-black text-center tracking-wider text-sky-400 mb-1">SKILL TREE</h1>
      <p class="text-xs text-center text-gray-400 mb-6">Catalog masteries and pass them forward</p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Email</label>
          <input type="email" id="authEmail" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:border-sky-500 outline-none text-white">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Password (6+ chars)</label>
          <input type="password" id="authPassword" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm focus:border-sky-500 outline-none text-white">
        </div>
        <div id="authStatus" class="text-xs text-red-400 hidden"></div>
        <button id="signInBtn" class="w-full py-2.5 bg-sky-500 hover:bg-sky-600 rounded-lg font-semibold text-sm text-gray-950 transition">Log In</button>
        <button id="signUpBtn" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 rounded-lg font-semibold text-sm text-gray-200 transition">Create Account</button>
      </div>
    </div>
  </div>

  <!-- APP HEADER -->
  <header class="h-14 border-b border-gray-800 bg-gray-950/80 backdrop-blur px-4 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center space-x-2">
      <span class="text-sm font-bold tracking-widest text-sky-400">SKILL TREE</span>
      <select id="treeSelect" class="bg-gray-900 border border-gray-800 rounded px-2 py-1 text-xs font-semibold focus:outline-none focus:border-sky-500 text-white">
        <option value="Culinary Arts">Culinary Arts</option>
        <option value="Construction & Framing">Construction & Framing</option>
      </select>
    </div>
    <div class="flex items-center space-x-2">
      <button id="newTreeBtn" class="px-2 py-1 bg-gray-800 text-sky-400 border border-gray-700 rounded text-xs font-semibold">+ Tree</button>
      <button id="addNodeBtn" class="px-2 py-1 bg-sky-500 text-gray-950 rounded text-xs font-bold">+ Skill</button>
      <button id="logOutBtn" class="px-2 py-1 bg-gray-800 text-gray-400 rounded text-xs">Exit</button>
    </div>
  </header>

  <!-- CONSTELLATION CANVAS -->
  <main class="relative flex-1 bg-gray-950 overflow-hidden">
    <canvas id="treeCanvas" class="absolute inset-0 w-full h-full"></canvas>
    <div id="nodesContainer" class="absolute inset-0 pointer-events-none"></div>
  </main>

  <!-- SKILL DETAIL MODAL -->
  <div id="detailModal" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-4">
    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-2xl max-h-[85vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-start">
        <h2 id="modalTitle" class="text-lg font-bold text-sky-400">Skill Details</h2>
        <button id="closeModalBtn" class="text-gray-400 text-sm p-1">✕</button>
      </div>
      <img id="modalMedia" class="w-full h-44 object-cover rounded-lg bg-gray-950 border border-gray-800" src="" alt="Skill preview">
      <div>
        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Image / GIF URL</label>
        <input type="text" id="modalMediaUrl" placeholder="Paste image or GIF link..." class="w-full bg-gray-950 border border-gray-800 rounded-lg px-2.5 py-1.5 text-xs text-gray-200 outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Status</label>
        <div class="grid grid-cols-3 gap-2">
          <button data-status="locked" class="status-toggle py-1.5 text-xs rounded border border-gray-800 bg-gray-950 text-gray-400">Locked</button>
          <button data-status="learning" class="status-toggle py-1.5 text-xs rounded border border-gray-800 bg-gray-950 text-gray-400">Learning</button>
          <button data-status="mastered" class="status-toggle py-1.5 text-xs rounded border border-gray-800 bg-gray-950 text-gray-400">Mastered</button>
        </div>
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Mentorship Notes (To Pass Down)</label>
        <textarea id="modalNotes" rows="3" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2 text-xs text-gray-200 outline-none focus:border-sky-500"></textarea>
      </div>
      <button id="saveSkillBtn" class="w-full py-2.5 bg-sky-500 text-gray-950 rounded-lg font-bold text-xs">Save Updates</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBaAcBLfnUulVRxlGx8YKyXFQrm-fIYsms",
      authDomain: "skill-tree-4cffd.firebaseapp.com",
      projectId: "skill-tree-4cffd",
      storageBucket: "skill-tree-4cffd.firebasestorage.app",
      messagingSenderId: "482405207638",
      appId: "1:482405207638:web:1a2a944ab4d8036e1ab5f7"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let selectedTree = "Culinary Arts";
    let activeNode = null;

    const defaultData = {
      "Culinary Arts": [
        { id: "c1", title: "Knife Skills", status: "mastered", x: 50, y: 80, media: "https://images.unsplash.com/photo-1590794056226-79ef3a8147e1?w=500", notes: "Keep fingers curled like a bear claw. Focus on rock-chop motion.", parentId: null },
        { id: "c2", title: "Heat Control", status: "learning", x: 30, y: 55, media: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=500", notes: "Preheat pan before adding oil. Let protein release naturally.", parentId: "c1" },
        { id: "c3", title: "Stock & Broth", status: "locked", x: 70, y: 55, media: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=500", notes: "Gently simmer bones; never boil vigorously to prevent cloudiness.", parentId: "c1" },
        { id: "c4", title: "Pan Sauces", status: "locked", x: 50, y: 30, media: "https://images.unsplash.com/photo-1476124369491-e7addf5db371?w=500", notes: "Deglaze the fond with stock, reduce, and mount cold butter off heat.", parentId: "c2" }
      ],
      "Construction & Framing": [
        { id: "f1", title: "Tape & Layout", status: "mastered", x: 50, y: 80, media: "https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=500", notes: "Always pull from the same index point. Check square with 3-4-5 rule.", parentId: null },
        { id: "f2", title: "Saw Operations", status: "mastered", x: 35, y: 55, media: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=500", notes: "Never reach across blade line. Account for 1/8-inch blade kerf.", parentId: "f1" },
        { id: "f3", title: "Wall Framing", status: "learning", x: 65, y: 55, media: "https://images.unsplash.com/photo-1513694203232-719a280e022f?w=500", notes: "16-inch on-center spacing. Face stud crowns the same direction.", parentId: "f1" },
        { id: "f4", title: "Truss Assembly", status: "locked", x: 50, y: 30, media: "https://images.unsplash.com/photo-1581094794329-c8112a89af12?w=500", notes: "Ensure pitch angle match and secure diagonal compression bracing.", parentId: "f3" }
      ]
    };

    let userTreeData = JSON.parse(JSON.stringify(defaultData));

    const authScreen = document.getElementById("authScreen");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const authStatus = document.getElementById("authStatus");
    const signInBtn = document.getElementById("signInBtn");
    const signUpBtn = document.getElementById("signUpBtn");
    const logOutBtn = document.getElementById("logOutBtn");
    const treeSelect = document.getElementById("treeSelect");
    const newTreeBtn = document.getElementById("newTreeBtn");
    const addNodeBtn = document.getElementById("addNodeBtn");
    const canvas = document.getElementById("treeCanvas");
    const ctx = canvas.getContext("2d");
    const nodesContainer = document.getElementById("nodesContainer");
    const detailModal = document.getElementById("detailModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalMedia = document.getElementById("modalMedia");
    const modalMediaUrl = document.getElementById("modalMediaUrl");
    const modalNotes = document.getElementById("modalNotes");
    const saveSkillBtn = document.getElementById("saveSkillBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");

    function showStatus(msg, isError = true) {
      authStatus.textContent = msg;
      authStatus.className = isError ? "text-xs text-red-400" : "text-xs text-sky-400";
      authStatus.classList.remove("hidden");
    }

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      renderTree();
    }
    window.addEventListener("resize", resizeCanvas);

    signUpBtn.onclick = async () => {
      showStatus("Creating account...", false);
      try {
        await auth.createUserWithEmailAndPassword(authEmail.value.trim(), authPassword.value);
      } catch (err) {
        showStatus(err.message, true);
      }
    };

    signInBtn.onclick = async () => {
      showStatus("Logging in...", false);
      try {
        await auth.signInWithEmailAndPassword(authEmail.value.trim(), authPassword.value);
      } catch (err) {
        showStatus(err.message, true);
      }
    };

    logOutBtn.onclick = () => auth.signOut();

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        authStatus.classList.add("hidden");
        authScreen.classList.add("hidden");
        await loadUserData();
      } else {
        currentUser = null;
        authScreen.classList.remove("hidden");
      }
    });

    async function loadUserData() {
      try {
        const doc = await db.collection("user_trees").doc(currentUser.uid).get();
        if (doc.exists && doc.data().trees) {
          userTreeData = doc.data().trees;
        } else {
          userTreeData = JSON.parse(JSON.stringify(defaultData));
          await db.collection("user_trees").doc(currentUser.uid).set({ trees: userTreeData });
        }
      } catch (e) {
        console.error(e);
      }
      updateTreeDropdown();
      resizeCanvas();
    }

    async function saveUserData() {
      if (!currentUser) return;
      await db.collection("user_trees").doc(currentUser.uid).set({ trees: userTreeData });
    }

    function updateTreeDropdown() {
      const keys = Object.keys(userTreeData);
      if (!keys.includes(selectedTree) && keys.length > 0) selectedTree = keys[0];
      treeSelect.innerHTML = keys.map(k => `<option value="${k}" ${k === selectedTree ? "selected" : ""}>${k}</option>`).join("");
    }

    function renderTree() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      nodesContainer.innerHTML = "";
      const currentNodes = userTreeData[selectedTree] || [];

      currentNodes.forEach(node => {
        if (node.parentId) {
          const parent = currentNodes.find(n => n.id === node.parentId);
          if (parent) {
            const x1 = (parent.x / 100) * canvas.width;
            const y1 = (parent.y / 100) * canvas.height;
            const x2 = (node.x / 100) * canvas.width;
            const y2 = (node.y / 100) * canvas.height;

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineWidth = 2;
            ctx.strokeStyle = node.status === "mastered" ? "#38bdf8" : (node.status === "learning" ? "#eab308" : "#374151");
            ctx.setLineDash(node.status === "locked" ? [4, 4] : []);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }
      });

      currentNodes.forEach(node => {
        const div = document.createElement("div");
        div.className = "absolute pointer-events-auto flex flex-col items-center -translate-x-1/2 -translate-y-1/2 cursor-pointer";
        div.style.left = `${node.x}%`;
        div.style.top = `${node.y}%`;

        let color = "bg-gray-800 border-gray-600";
        if (node.status === "mastered") color = "bg-sky-400 border-sky-300 shadow-lg shadow-sky-500/50 node-pulse";
        if (node.status === "learning") color = "bg-amber-400 border-amber-300 shadow-lg shadow-amber-500/50";

        div.innerHTML = `
          <div class="w-8 h-8 rounded-full border-2 ${color} flex items-center justify-center text-xs font-bold text-gray-950">
            ${node.status === "mastered" ? "★" : (node.status === "learning" ? "▲" : "•")}
          </div>
          <span class="text-[11px] font-semibold tracking-wide text-gray-300 mt-1 whitespace-nowrap bg-gray-950/80 px-2 py-0.5 rounded border border-gray-800">${node.title}</span>
        `;

        div.onclick = () => openModal(node);
        nodesContainer.appendChild(div);
      });
    }

    treeSelect.onchange = (e) => {
      selectedTree = e.target.value;
      renderTree();
    };

    newTreeBtn.onclick = async () => {
      const treeName = prompt("Name of your new Skill Tree (e.g., Welding, Gardening):");
      if (!treeName || userTreeData[treeName]) return;
      userTreeData[treeName] = [
        { id: "n_" + Date.now(), title: "Core Fundamentals", status: "learning", x: 50, y: 80, media: "https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=500", notes: "Starting foundation for " + treeName, parentId: null }
      ];
      selectedTree = treeName;
      updateTreeDropdown();
      renderTree();
      await saveUserData();
    };

    function openModal(node) {
      activeNode = node;
      modalTitle.textContent = node.title;
      modalMedia.src = node.media || "https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=500";
      modalMediaUrl.value = node.media || "";
      modalNotes.value = node.notes || "";
      updateStatusToggles(node.status);
      detailModal.classList.remove("hidden");
    }

    function updateStatusToggles(status) {
      document.querySelectorAll(".status-toggle").forEach(btn => {
        if (btn.dataset.status === status) {
          btn.className = "status-toggle py-1.5 text-xs rounded border border-sky-400 bg-sky-500 text-gray-950 font-bold";
        } else {
          btn.className = "status-toggle py-1.5 text-xs rounded border border-gray-800 bg-gray-950 text-gray-400";
        }
      });
    }

    document.querySelectorAll(".status-toggle").forEach(btn => {
      btn.onclick = () => {
        if (activeNode) activeNode.status = btn.dataset.status;
        updateStatusToggles(btn.dataset.status);
      };
    });

    closeModalBtn.onclick = () => detailModal.classList.add("hidden");

    saveSkillBtn.onclick = async () => {
      if (activeNode) {
        activeNode.notes = modalNotes.value;
        if (modalMediaUrl.value.trim()) activeNode.media = modalMediaUrl.value.trim();
        detailModal.classList.add("hidden");
        renderTree();
        await saveUserData();
      }
    };

    addNodeBtn.onclick = async () => {
      const name = prompt("Name of the new skill:");
      if (!name) return;
      const currentNodes = userTreeData[selectedTree] || [];
      const xPositions = [50, 30, 70, 50, 25, 75, 50];
      const newNode = {
        id: "s_" + Date.now(),
        title: name,
        status: "locked",
        x: xPositions[currentNodes.length % xPositions.length],
        y: Math.max(15, 80 - currentNodes.length * 14),
        media: "https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=500",
        notes: "Key concepts and practical execution notes.",
        parentId: currentNodes.length > 0 ? currentNodes[currentNodes.length - 1].id : null
      };
      currentNodes.push(newNode);
      renderTree();
      await saveUserData();
    };

    setTimeout(resizeCanvas, 50);
  </script>
</body>
</html>
