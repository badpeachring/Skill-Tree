<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0714">
  <link rel="manifest" href="manifest.json">
  <title>App Forge • 2D Loft Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-card { background: rgba(18, 11, 28, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(244, 63, 94, 0.25); }
    @keyframes mjIdleRich {
      0% { transform: scale(1.015) translate3d(0px, 0px, 0); filter: brightness(1.0) contrast(1.02); }
      33% { transform: scale(1.038) translate3d(-4px, -4px, 0); filter: brightness(1.05) contrast(1.04); }
      66% { transform: scale(1.026) translate3d(4px, -2px, 0); filter: brightness(1.02) contrast(1.03); }
      100% { transform: scale(1.015) translate3d(0px, 0px, 0); filter: brightness(1.0) contrast(1.02); }
    }
    @keyframes mjHackPulse {
      0%, 100% { transform: scale(1.02) translate3d(0, 0, 0); filter: brightness(1.02); }
      50% { transform: scale(1.04) translate3d(-2px, -1px, 0); filter: brightness(1.13); }
    }
    @keyframes mjCelebratePop {
      0%, 100% { transform: scale(1.02) translate3d(0, 0, 0); filter: brightness(1.05); }
      50% { transform: scale(1.05) translate3d(0, -6px, 0); filter: brightness(1.14); }
    }
    @keyframes mjSwayFloat {
      0%, 100% { transform: scale(1.03) translate3d(-5px, 0, 0); }
      50% { transform: scale(1.035) translate3d(5px, -3px, 0); }
    }
    .fx-idle { animation: mjIdleRich 11s ease-in-out infinite; will-change: transform, filter; }
    .fx-hack { animation: mjHackPulse 0.95s ease-in-out infinite; will-change: transform, filter; }
    .fx-celebrate { animation: mjCelebratePop 1.35s ease-in-out infinite; will-change: transform, filter; }
    .fx-sway { animation: mjSwayFloat 3.6s ease-in-out infinite; will-change: transform; }
    .fx-paused { animation: none !important; transform: scale(1) !important; filter: none !important; }
  </style>
</head>
<body class="bg-[#0d0714] text-amber-50 min-h-screen p-3.5 font-sans">
  <div class="max-w-lg mx-auto space-y-3 pb-12">

    <div class="relative rounded-3xl overflow-hidden border border-rose-500/35 shadow-2xl bg-[#140b20]">
      <div class="absolute top-2.5 left-2.5 right-2.5 z-20 flex items-center justify-between pointer-events-none">
        <div class="bg-black/75 backdrop-blur-md px-3 py-1 rounded-full border border-rose-400/50 text-[10px] font-black uppercase text-rose-200 pointer-events-auto">🌸 2D Loft Studio</div>
        <div class="flex items-center gap-1.5 pointer-events-auto">
          <div id="buildBadge" class="px-3 py-1 rounded-full text-[11px] font-bold bg-black/75 backdrop-blur-md border border-amber-400/35 text-amber-200">Wave</div>
          <button id="settingsBtn" type="button" class="w-7 h-7 rounded-full bg-black/80 backdrop-blur-md border border-rose-400/45 text-xs flex items-center justify-center text-rose-200 active:scale-95">⚙️</button>
        </div>
      </div>

      <div id="settingsPopover" class="hidden absolute top-11 right-2.5 z-30 w-52 rounded-2xl bg-[#160c24]/95 border border-rose-500/45 p-3 shadow-2xl space-y-2.5 backdrop-blur-xl">
        <div class="text-[10px] font-black uppercase tracking-wider text-rose-300">Studio Settings</div>
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-bold text-amber-200">✨ Living Motion</span>
          <button id="motionToggleBtn" type="button" class="px-2.5 py-1 rounded-full text-[10px] font-black bg-emerald-500 text-slate-950">ON</button>
        </div>
        <div class="flex items-center justify-between pt-1.5 border-t border-rose-500/20">
          <span class="text-[11px] font-bold text-pink-200">🎭 Poses</span>
          <button id="posesToggleBtn" type="button" class="px-2.5 py-1 rounded-full text-[10px] font-black bg-slate-800 border border-rose-500/40 text-rose-300">OFF</button>
        </div>
      </div>

      <div id="stage2d" class="w-full aspect-video relative overflow-hidden bg-[#140b20]">
        <div id="layerA" class="absolute inset-0 transition-opacity duration-300 opacity-100"></div>
        <div id="layerB" class="absolute inset-0 transition-opacity duration-300 opacity-0"></div>
        <div id="fxGlow" class="absolute inset-0 pointer-events-none transition-all duration-500"></div>
      </div>

      <div id="posesPanel" class="hidden space-y-1.5 px-3 py-2 bg-black/85 border-t border-rose-500/20">
        <div class="grid grid-cols-4 gap-1.5">
          <button id="cmdIdleBtn" type="button" class="py-1.5 rounded-lg bg-slate-800/90 border border-rose-500/30 text-[11px] font-bold text-rose-200">😌 Idle</button>
          <button id="cmdHackBtn" type="button" class="py-1.5 rounded-lg bg-slate-800/90 border border-sky-500/30 text-[11px] font-bold text-sky-200">💻 Hack</button>
          <button id="cmdWaveBtn" type="button" class="py-1.5 rounded-lg bg-slate-800/90 border border-amber-500/30 text-[11px] font-bold text-amber-200">👋 Wave</button>
          <button id="cmdCelebrateBtn" type="button" class="py-1.5 rounded-lg bg-slate-800/90 border border-emerald-500/30 text-[11px] font-bold text-emerald-200">🎉 Celebrate</button>
        </div>
        <div class="grid grid-cols-4 gap-1.5">
          <button id="cmdSwayBtn" type="button" class="py-1.5 rounded-lg bg-rose-950/90 border border-rose-500/50 text-[11px] font-bold text-rose-200">💃 Sway</button>
          <button id="cmdKissBtn" type="button" class="py-1.5 rounded-lg bg-pink-950/90 border border-pink-500/50 text-[11px] font-bold text-pink-200">😘 Kiss</button>
          <button id="cmdKneelBtn" type="button" class="py-1.5 rounded-lg bg-fuchsia-950/90 border border-fuchsia-500/50 text-[11px] font-bold text-fuchsia-200">🧎 Pose</button>
          <button id="cmdTeaseBtn" type="button" class="py-1.5 rounded-lg bg-red-950/90 border border-red-500/50 text-[11px] font-bold text-red-200">🔥 Tease</button>
        </div>
      </div>

      <div id="mjSpeech" class="px-4 py-2 bg-black/95 border-t border-rose-500/25 text-[11px] text-amber-200 flex items-center justify-between gap-2">
        <span class="truncate">💬 "Booting 2D Loft Studio..."</span>
        <span id="repoCounterPill" class="text-[10px] font-bold text-emerald-400 shrink-0"></span>
      </div>
    </div>

    <div class="glass-card rounded-2xl p-3.5 space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-[10px] font-black uppercase text-amber-300">1. GitHub Token</span>
        <button id="toggleTokenBtn" type="button" class="text-[11px] text-rose-300/70 underline">Show / Edit</button>
      </div>
      <div id="tokenWrap" class="flex gap-2">
        <input id="ghToken" type="password" placeholder="Paste token" class="flex-1 bg-black/60 border border-rose-500/30 rounded-xl px-3 py-2 text-xs text-white outline-none">
        <button id="saveTokenBtn" type="button" class="px-4 py-2 bg-gradient-to-r from-rose-500 to-amber-500 text-slate-950 font-black rounded-xl text-xs">Connect</button>
      </div>
    </div>

    <div class="glass-card rounded-2xl p-3.5 space-y-2.5">
      <div class="text-[10px] font-black uppercase text-rose-300">2. Select App Repo & File</div>
      <div class="grid grid-cols-2 gap-2">
        <select id="repoSelect" class="bg-black/60 border border-rose-500/30 rounded-xl px-2.5 py-2 text-xs text-white outline-none"></select>
        <select id="fileSelect" class="bg-black/60 border border-rose-500/30 rounded-xl px-2.5 py-2 text-xs text-white outline-none"></select>
      </div>
      <div class="flex gap-2">
        <input id="newFileName" type="text" placeholder="Or new filename" class="flex-1 bg-black/60 border border-rose-500/30 rounded-xl px-3 py-1.5 text-xs text-white outline-none">
        <button id="createFileModeBtn" type="button" class="px-3.5 py-1.5 bg-rose-500/20 border border-rose-500/40 text-rose-200 font-bold rounded-xl text-xs">+ New</button>
      </div>
    </div>

    <div class="glass-card rounded-2xl p-3.5 space-y-2.5">
      <div class="flex items-center justify-between">
        <span id="activePathLabel" class="text-xs font-mono font-bold text-emerald-300 truncate">No file loaded</span>
        <div class="flex gap-1.5 shrink-0">
          <button id="pasteReplaceBtn" type="button" class="px-2.5 py-1.5 bg-amber-400 text-slate-950 font-black rounded-xl text-[11px]">📋 Paste All</button>
          <button id="copyCurrentBtn" type="button" class="px-2.5 py-1.5 bg-black/60 border border-rose-500/30 text-rose-200 font-bold rounded-xl text-[11px]">Copy</button>
        </div>
      </div>
      <textarea id="codeEditor" rows="12" spellcheck="false" placeholder="Type or paste code here..." class="w-full bg-[#07040b] border border-rose-500/25 rounded-xl p-3 text-[11px] text-amber-100 font-mono leading-relaxed outline-none"></textarea>
      <div class="flex gap-2">
        <input id="commitMsg" type="text" value="2D Loft Studio update" class="flex-1 bg-black/60 border border-rose-500/30 rounded-xl px-3 py-2 text-xs text-white outline-none">
        <button id="deployBtn" type="button" class="px-5 py-2.5 bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 text-white font-black rounded-xl text-xs shrink-0 shadow-lg">🚀 Deploy Now</button>
      </div>
      <a id="liveSiteLink" href="#" target="_blank" class="hidden block text-center py-2 bg-black/60 border border-emerald-500/40 rounded-xl text-xs font-bold text-emerald-300">↗ Open Live App</a>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "app_forge_gh_token_v1";
    const POSES_KEY = "app_forge_poses_v1";
    const MOTION_KEY = "app_forge_motion_v1";
    const ASSET_VER = Date.now().toString();

    let ghUser = "", currentSha = null, isNewFile = false, introTimer = null, resetTimer = null;
    let activeLayer = "A", currentMode = "wave", deploySeq = 0;
    let posesEnabled = localStorage.getItem(POSES_KEY) === "1";
    let motionEnabled = localStorage.getItem(MOTION_KEY) !== "0";

    const assetCache = new Map();
    const $ = id => document.getElementById(id);
    const getToken = () => localStorage.getItem(TOKEN_KEY) || $("ghToken")?.value.trim() || "";
    const getHeaders = () => ({
      "Authorization": `Bearer ${getToken()}`,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json"
    });

    const FX_MAP = {
      idle: { cls: "fx-idle", glow: "radial-gradient(circle at 24% 52%, rgba(56,189,248,0.16), rgba(244,63,94,0.08) 45%, transparent 65%)" },
      hack: { cls: "fx-hack", glow: "radial-gradient(circle at 22% 52%, rgba(52,211,153,0.28), transparent 58%)" },
      wave: { cls: "fx-idle", glow: "radial-gradient(circle at 60% 45%, rgba(251,191,36,0.16), transparent 55%)" },
      celebrate: { cls: "fx-celebrate", glow: "radial-gradient(circle at 30% 48%, rgba(16,185,129,0.34), transparent 65%)" },
      sway: { cls: "fx-sway", glow: "radial-gradient(circle at 55% 50%, rgba(244,63,94,0.22), transparent 60%)" },
      kiss: { cls: "fx-idle", glow: "radial-gradient(circle at 55% 45%, rgba(236,72,153,0.24), transparent 60%)" },
      pose: { cls: "fx-sway", glow: "radial-gradient(circle at 55% 50%, rgba(192,38,211,0.22), transparent 60%)" },
      tease: { cls: "fx-sway", glow: "radial-gradient(circle at 55% 50%, rgba(239,68,68,0.25), transparent 60%)" }
    };

    window.addEventListener("error", e => {
      const sp = $("mjSpeech")?.firstElementChild;
      if (sp) sp.textContent = `⚠️ ${e.message || "Script error"}`;
    });

    function toUtf8Base64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (let i = 0; i < bytes.length; i += 8192) {
        bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
      }
      return btoa(bin);
    }

    function fromUtf8Base64(b64) {
      const clean = (b64 || "").replace(/\n/g, "");
      const raw = atob(clean);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    async function resolveAsset(stateName) {
      if (assetCache.has(stateName)) return assetCache.get(stateName);
      const exts = ["mp4", "webp", "png", "jpg", "jpeg"];
      for (const ext of exts) {
        const url = `${stateName}.${ext}?v=${ASSET_VER}`;
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (res.ok) {
            const entry = { url, type: ext === "mp4" ? "video" : "image" };
            assetCache.set(stateName, entry);
            return entry;
          }
        } catch {}
      }
      assetCache.set(stateName, null);
      return null;
    }

    function buildMediaNode(asset, fxClass) {
      const paused = motionEnabled ? "" : " fx-paused";
      if (asset.type === "video") {
        const v = document.createElement("video");
        v.src = asset.url;
        v.autoplay = true;
        v.loop = true;
        v.muted = true;
        v.playsInline = true;
        v.className = `w-full h-full object-cover ${fxClass}${paused}`;
        return v;
      }
      const img = document.createElement("img");
      img.src = asset.url;
      img.alt = currentMode;
      img.className = `w-full h-full object-cover ${fxClass}${paused}`;
      return img;
    }

    async function renderScene(mode) {
      const fx = FX_MAP[mode] || FX_MAP.idle;
      $("fxGlow").style.background = fx.glow;

      let asset = await resolveAsset(mode);
      let usedFallback = false;
      if (!asset && mode !== "idle") {
        asset = await resolveAsset("idle");
        usedFallback = true;
      }

      const nextId = activeLayer === "A" ? "layerB" : "layerA";
      const prevId = activeLayer === "A" ? "layerA" : "layerB";
      const nextEl = $(nextId);
      const prevEl = $(prevId);

      if (!asset) {
        nextEl.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center text-center px-6">
          <div class="text-xs font-black uppercase tracking-widest text-rose-300">Art Not Found</div>
          <div class="text-[11px] text-amber-100/80 mt-1">Check <b>idle.jpg</b>, <b>hack.jpg</b>, <b>wave.jpg</b>, <b>celebrate.jpg</b> in App-Forge root.</div>
        </div>`;
      } else {
        nextEl.innerHTML = "";
        nextEl.appendChild(buildMediaNode(asset, fx.cls));
      }

      nextEl.classList.remove("opacity-0");
      nextEl.classList.add("opacity-100");
      prevEl.classList.remove("opacity-100");
      prevEl.classList.add("opacity-0");
      activeLayer = nextId === "layerA" ? "A" : "B";
      return usedFallback;
    }

    async function setMjState(mode, text, { cancelIntro = true } = {}) {
      if (cancelIntro && introTimer) {
        clearTimeout(introTimer);
        introTimer = null;
      }
      if (resetTimer) {
        clearTimeout(resetTimer);
        resetTimer = null;
      }
      currentMode = mode;
      if (text) $("mjSpeech").firstElementChild.textContent = `💬 "${text}"`;
      const usedFallback = await renderScene(mode);
      if (usedFallback && text) {
        $("mjSpeech").firstElementChild.textContent = `💬 "${text} (add ${mode} asset for custom art)"`;
      }
    }

    function scheduleIdleReturn(delayMs, text = "Ready for the next move!") {
      if (resetTimer) clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        setMjState("idle", text);
      }, delayMs);
    }

    function runGreetingSequence() {
      setMjState("wave", "Hey there! Welcome back to the loft.", { cancelIntro: false });
      introTimer = setTimeout(() => {
        introTimer = null;
        if (currentMode === "wave") {
          setMjState("idle", "Loft studio online — ready when you are.");
        }
      }, 2800);
    }

    function setBadge(text, tone = "idle") {
      const b = $("buildBadge");
      b.textContent = text;
      b.className = tone === "ok"
        ? "px-3 py-1 rounded-full text-[11px] font-bold bg-emerald-500/25 backdrop-blur-md border border-emerald-400 text-emerald-200"
        : tone === "busy"
        ? "px-3 py-1 rounded-full text-[11px] font-bold bg-amber-500/25 backdrop-blur-md border border-amber-400 text-amber-200"
        : "px-3 py-1 rounded-full text-[11px] font-bold bg-black/75 backdrop-blur-md border border-amber-400/35 text-amber-200";
    }

    function syncSettingsUI() {
      const pBtn = $("posesToggleBtn");
      pBtn.textContent = posesEnabled ? "ON" : "OFF";
      pBtn.className = posesEnabled
        ? "px-2.5 py-1 rounded-full text-[10px] font-black bg-rose-500 text-white"
        : "px-2.5 py-1 rounded-full text-[10px] font-black bg-slate-800 border border-rose-500/40 text-rose-300";
      $("posesPanel").classList.toggle("hidden", !posesEnabled);

      const mBtn = $("motionToggleBtn");
      mBtn.textContent = motionEnabled ? "ON" : "OFF";
      mBtn.className = motionEnabled
        ? "px-2.5 py-1 rounded-full text-[10px] font-black bg-emerald-500 text-slate-950"
        : "px-2.5 py-1 rounded-full text-[10px] font-black bg-slate-800 border border-amber-500/40 text-amber-300";

      document.querySelectorAll("#stage2d img, #stage2d video").forEach(el => {
        el.classList.toggle("fx-paused", !motionEnabled);
      });
    }

    async function initConnection() {
      const tok = localStorage.getItem(TOKEN_KEY);
      if (!tok) return;
      $("ghToken").value = tok;
      $("tokenWrap").classList.add("hidden");
      setBadge("Connecting...", "busy");
      const uRes = await fetch("https://api.github.com/user", { headers: getHeaders() });
      if (!uRes.ok) { setBadge("Token Error"); $("tokenWrap").classList.remove("hidden"); return; }
      const u = await uRes.json();
      ghUser = u.login;
      const rRes = await fetch("https://api.github.com/user/repos?per_page=100&sort=updated", { headers: getHeaders() });
      const repos = await rRes.json();
      $("repoSelect").innerHTML = repos.map(r => `<option value="${r.name}">${r.name}</option>`).join("");
      $("repoCounterPill").textContent = `${repos.length} Repos`;
      if (repos.some(r => r.name === "Skill-Tree")) $("repoSelect").value = "Skill-Tree";
      setBadge(`Connected: ${ghUser}`, "ok");
      await loadRepoFiles();
    }

    async function loadRepoFiles() {
      const repo = $("repoSelect").value;
      if (!repo || !ghUser) return;
      const link = $("liveSiteLink");
      link.href = `https://${ghUser.toLowerCase()}.github.io/${repo}/`;
      link.textContent = `↗ Open Live ${repo}`;
      link.classList.remove("hidden");
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/`, { headers: getHeaders() });
      const items = await res.json();
      const files = Array.isArray(items) ? items.filter(x => x.type === "file") : [];
      $("fileSelect").innerHTML = files.map(f => `<option value="${f.path}">${f.path}</option>`).join("");
      if (files.length) await loadFileContent(files[0].path);
    }

    async function loadFileContent(path) {
      const repo = $("repoSelect").value;
      isNewFile = false;
      $("activePathLabel").textContent = `${repo}/${path}`;
      setBadge("Loading...", "busy");
      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/${path}`, { headers: getHeaders() });
      const data = await res.json();
      currentSha = data.sha;
      if (data.content) {
        $("codeEditor").value = fromUtf8Base64(data.content);
      } else {
        $("codeEditor").value = "[Binary or large file — edit text files only]";
      }
      setBadge("Ready", "ok");
    }

    function triggerUpdateActive(repo, path, badgeLabel, speechText) {
      setBadge(badgeLabel, "ok");
      setMjState("celebrate", speechText);
      scheduleIdleReturn(5000, `${repo}/${path} is live and ready.`);
    }

    async function deployFile() {
      const repo = $("repoSelect").value;
      const path = isNewFile ? $("newFileName").value.trim() : $("fileSelect").value;
      if (!repo || !path) return alert("Select or name a file first.");
      const seq = ++deploySeq;
      const encoded = toUtf8Base64($("codeEditor").value);

      setBadge("Deploying...", "busy");
      await setMjState("hack", `Hacking & pushing ${path} to ${repo}...`);

      const body = { message: $("commitMsg").value.trim() || `Update ${path}`, content: encoded };
      if (!isNewFile && currentSha) body.sha = currentSha;

      const res = await fetch(`https://api.github.com/repos/${ghUser}/${repo}/contents/${path}`, {
        method: "PUT",
        headers: getHeaders(),
        body: JSON.stringify(body)
      });

      if (seq !== deploySeq) return;
      if (!res.ok) {
        const err = await res.json();
        setBadge("Deploy Failed");
        await setMjState("idle", "Deploy failed — check alert.");
        return alert("API Error: " + (err.message || res.status));
      }

      const out = await res.json();
      currentSha = out.content.sha;
      isNewFile = false;
      $("activePathLabel").textContent = `${repo}/${path}`;
      triggerUpdateActive(repo, path, "🟢 Update Active!", `${path} is pushed and active on ${repo}!`);
    }

    function boot() {
      syncSettingsUI();
      ["idle", "hack", "wave", "celebrate"].forEach(s => resolveAsset(s));
      runGreetingSequence();

      $("settingsBtn").onclick = e => {
        e.stopPropagation();
        $("settingsPopover").classList.toggle("hidden");
      };
      document.addEventListener("click", e => {
        if (!e.target.closest("#settingsPopover") && !e.target.closest("#settingsBtn")) {
          $("settingsPopover").classList.add("hidden");
        }
      });
      $("motionToggleBtn").onclick = () => {
        motionEnabled = !motionEnabled;
        localStorage.setItem(MOTION_KEY, motionEnabled ? "1" : "0");
        syncSettingsUI();
      };
      $("posesToggleBtn").onclick = () => {
        posesEnabled = !posesEnabled;
        localStorage.setItem(POSES_KEY, posesEnabled ? "1" : "0");
        syncSettingsUI();
        $("settingsPopover").classList.add("hidden");
        if (posesEnabled) setMjState("pose", "Pose controls unlocked.");
      };

      $("cmdIdleBtn").onclick = () => setMjState("idle", "Chilling in the loft — ready when you are.");
      $("cmdHackBtn").onclick = () => setMjState("hack", "Terminal engaged! Hacking build...");
      $("cmdWaveBtn").onclick = () => setMjState("wave", "Hey there! Systems are green.");
      $("cmdCelebrateBtn").onclick = () => setMjState("celebrate", "Woohoo! Build is live!");
      $("cmdSwayBtn").onclick = () => setMjState("sway", "Feeling the vibe in the loft...");
      $("cmdKissBtn").onclick = () => setMjState("kiss", "Muah! Good luck on this deploy.");
      $("cmdKneelBtn").onclick = () => setMjState("pose", "Striking a pose for you...");
      $("cmdTeaseBtn").onclick = () => setMjState("tease", "Like what you see? Let's ship some code.");

      $("codeEditor").addEventListener("input", () => {
        if (currentMode !== "hack") setMjState("hack", "Typing edits into terminal...");
        scheduleIdleReturn(2000, "Ready — hit Deploy Now!");
      });

      $("saveTokenBtn").onclick = () => {
        const val = $("ghToken").value.trim();
        if (!val) return;
        localStorage.setItem(TOKEN_KEY, val);
        initConnection();
      };
      $("toggleTokenBtn").onclick = () => $("tokenWrap").classList.toggle("hidden");
      $("repoSelect").onchange = loadRepoFiles;
      $("fileSelect").onchange = () => loadFileContent($("fileSelect").value);
      $("createFileModeBtn").onclick = () => {
        const fn = $("newFileName").value.trim();
        if (!fn) return alert("Type filename first");
        isNewFile = true;
        currentSha = null;
        $("activePathLabel").textContent = `${$("repoSelect").value}/${fn} (NEW)`;
        $("codeEditor").value = "";
      };
      $("pasteReplaceBtn").onclick = async () => {
        const editor = $("codeEditor");
        editor.focus();
        try {
          const clip = await navigator.clipboard.readText();
          if (clip) { editor.value = clip; setMjState("hack", "Clipboard loaded — ready to deploy!"); return; }
        } catch {}
        const manual = prompt("Paste your code here:");
        if (manual !== null) { editor.value = manual; setMjState("hack", "Code loaded!"); }
      };
      $("copyCurrentBtn").onclick = async () => {
        await navigator.clipboard.writeText($("codeEditor").value);
        setBadge("Copied!", "ok");
      };
      $("deployBtn").onclick = deployFile;

      if (localStorage.getItem(TOKEN_KEY)) initConnection();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
